<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CastByte Receiver</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #07090D;
    overflow: hidden;
  }

  #whiteboard-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
  }

  #pdf-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #07090D;
    display: none;
    align-items: center;
    justify-content: center;
  }

  #pdf-canvas {
    max-width: 100%;
    max-height: 100%;
  }
</style>
</head>
<body>

<canvas id="whiteboard-canvas"></canvas>

<div id="pdf-overlay">
  <canvas id="pdf-canvas"></canvas>
</div>

<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/pdf.worker.min.mjs';

  const PDF_NAMESPACE = 'urn:x-cast:com.app.screenmirroringcastbyte.pdf';
  const WHITEBOARD_NAMESPACE = 'urn:x-cast:com.app.screenmirroringcastbyte.whiteboard';

  const whiteboardCanvas = document.getElementById('whiteboard-canvas');
  const whiteboardCtx = whiteboardCanvas.getContext('2d');

  const pdfOverlay = document.getElementById('pdf-overlay');
  const pdfCanvas = document.getElementById('pdf-canvas');
  const pdfCtx = pdfCanvas.getContext('2d');

  function resizeWhiteboardCanvas() {
    whiteboardCanvas.width = window.innerWidth;
    whiteboardCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeWhiteboardCanvas);
  resizeWhiteboardCanvas();

  // MARK: - PDF namespace

  function showPdfOverlay(url) {
    whiteboardCanvas.style.display = 'none';
    pdfOverlay.style.display = 'flex';
    pdfjsLib.getDocument(url).promise.then(pdf => pdf.getPage(1)).then(page => {
      const viewport = page.getViewport({ scale: 1 });
      const scale = Math.min(window.innerWidth / viewport.width, window.innerHeight / viewport.height);
      const scaledViewport = page.getViewport({ scale });
      pdfCanvas.width = scaledViewport.width;
      pdfCanvas.height = scaledViewport.height;
      page.render({ canvasContext: pdfCtx, viewport: scaledViewport });
    }).catch(err => console.error('CastByte: failed to load PDF', err));
  }

  function hidePdfOverlay() {
    pdfOverlay.style.display = 'none';
  }

  // MARK: - Whiteboard namespace

  function drawStroke(points, color, width) {
    whiteboardCanvas.style.display = 'block';
    if (!points || points.length === 0) return;

    whiteboardCtx.strokeStyle = color || '#FFFFFF';
    whiteboardCtx.lineWidth = width || 4;
    whiteboardCtx.lineCap = 'round';
    whiteboardCtx.lineJoin = 'round';

    whiteboardCtx.beginPath();
    points.forEach((point, index) => {
      const x = point.x * whiteboardCanvas.width;
      const y = point.y * whiteboardCanvas.height;
      if (index === 0) {
        whiteboardCtx.moveTo(x, y);
      } else {
        whiteboardCtx.lineTo(x, y);
      }
    });
    whiteboardCtx.stroke();
  }

  function clearWhiteboard() {
    whiteboardCtx.clearRect(0, 0, whiteboardCanvas.width, whiteboardCanvas.height);
  }

  // MARK: - Cast receiver bootstrap

  const context = cast.framework.CastReceiverContext.getInstance();

  context.addCustomMessageListener(PDF_NAMESPACE, event => {
    const { action, url } = event.data;
    if (action === 'LOAD' && url) showPdfOverlay(url);
    else if (action === 'CLOSE') hidePdfOverlay();
  });

  context.addCustomMessageListener(WHITEBOARD_NAMESPACE, event => {
    const { action, points, color, width } = event.data;
    if (action === 'STROKE') drawStroke(points, color, width);
    else if (action === 'CLEAR') clearWhiteboard();
  });

  // Enables default media playback (Photo/Video/Audio) automatically —
  // no extra code needed for the standard CAF media pipeline.
  context.start();
</script>

</body>
</html>
